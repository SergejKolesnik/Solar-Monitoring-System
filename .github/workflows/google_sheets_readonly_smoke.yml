name: Google Sheets Controlled Write Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed smoke test
        uses: actions/checkout@v4
        with:
          ref: 1135651c19c3f58b05496103cf0701e2ce409363

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install smoke-test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pandas requests openpyxl gspread==6.2.1 google-auth==2.40.3
          scikit-learn

      - name: Run controlled write against test spreadsheet
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python scripts/google_sheets_write_smoke.py
