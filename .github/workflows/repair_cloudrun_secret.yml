name: Repair Cloud Run Google Credentials Secret

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair-secret:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate GitHub credentials secret shape
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          raw = os.environ.get("GOOGLE_CREDENTIALS", "")
          if not raw:
              print("GOOGLE_CREDENTIALS is empty", file=sys.stderr)
              sys.exit(1)

          data = json.loads(raw)
          if data.get("type") != "service_account" or not data.get("client_email"):
              print("GOOGLE_CREDENTIALS is not a service-account JSON", file=sys.stderr)
              sys.exit(1)

          print("GOOGLE_CREDENTIALS shape OK")
          PY

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}
          project_id: skygrid-solar-ai-nzf

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Add Secret Manager version
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          printf '%s' "$GOOGLE_CREDENTIALS" | gcloud secrets versions add GOOGLE_CREDENTIALS \
            --project skygrid-solar-ai-nzf \
            --data-file=-
          echo "GOOGLE_CREDENTIALS Secret Manager version added"

      - name: Refresh Cloud Run revision
        run: |
          gcloud run services update skygrid-solar-ai \
            --project skygrid-solar-ai-nzf \
            --region europe-west1 \
            --set-secrets=GOOGLE_CREDENTIALS=GOOGLE_CREDENTIALS:latest,WEATHER_API_KEY=WEATHER_API_KEY:latest
